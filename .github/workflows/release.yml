name: release

# PR、main push 与 merge queue 候选共用相同的测试和发布产物预检。
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

      - name: Repeat terminal integration test
        run: go test -count=3 ./internal/integration -run '^TestWizardTerminal$'

      - name: Race test
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o "$RUNNER_TEMP/cpagw" ./cmd/cpagw

  test-macos:
    name: test-macos
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

      - name: Repeat terminal integration test
        run: go test -count=3 ./internal/integration -run '^TestWizardTerminal$'

      - name: Race test
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o "$RUNNER_TEMP/cpagw" ./cmd/cpagw

  release-preview:
    name: release-preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check

      # Snapshot 不执行正式 tag/git validate，也不访问发布 API；这里只验证构建和打包链路。
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean

      - name: Verify release archives and checksums
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -I scripts/verify-release-artifacts.py dist

      - name: Test release artifact verifier
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -I scripts/verify_release_artifacts_test.py

      - name: Test fail-closed gate verifier
        run: python3 -I scripts/verify_ci_gate_test.py

  ci:
    name: ci / pre-merge
    if: ${{ always() }}
    needs: [test, test-macos, release-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Require every prerequisite to succeed
        env:
          LINUX_RESULT: ${{ needs.test.result }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
          RELEASE_PREVIEW_RESULT: ${{ needs.release-preview.result }}
        run: bash scripts/verify-ci-gate.sh "$LINUX_RESULT" "$MACOS_RESULT" "$RELEASE_PREVIEW_RESULT"

  tag:
    needs: ci
    # 只在 main push 且合并前汇总检查通过后打 tag。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 计算版本
        id: calc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 仅对「由已合并 PR 引入 main」的提交打 tag；直接 push 到 main 不触发发布。
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                 --jq '[.[] | select(.merged_at != null)] | .[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "该提交不是由已合并 PR 引入 main，跳过打 tag"
            exit 0
          fi
          short="$(git rev-parse --short=6 HEAD)"
          # GNU date 的 %-m/%-d 去掉前导零，否则 patch 位会变成 "05" 这种非法 semver，
          # GoReleaser 会拒绝该 tag。
          tag="v$(date -u +%Y.%-m.%-d)-${short}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} 已存在，跳过"
            exit 0
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "PR #${pr} -> ${tag}"

      - name: 打 tag 并推送
        if: steps.calc.outputs.tag != ''
        env:
          TAG: ${{ steps.calc.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" HEAD
          git push origin "refs/tags/$TAG"

  release:
    needs: tag
    # tag job 判定跳过时输出为空，此时不发布。
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 显式指定 tag，避免 GoReleaser 在 CI 中自行推断出错。
          GORELEASER_CURRENT_TAG: ${{ needs.tag.outputs.tag }}

      - name: 校验 Release 未被标为预发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.prerelease')"
          if [ "$prerelease" = "true" ]; then
            echo "::error::${TAG} 被标记为 Pre-release，/releases/latest 会跳过它，安装脚本取不到默认版本。"
            echo "::error::请确认 .goreleaser.yaml 未设置 release.prerelease: auto。"
            exit 1
          fi
          echo "${TAG} 已发布且为 Latest，安装脚本可正常取用"
